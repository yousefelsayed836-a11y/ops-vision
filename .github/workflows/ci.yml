name: OpsVision checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: opsvision
          POSTGRES_PASSWORD: ci-only-ephemeral-password
          POSTGRES_DB: opsvision_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U opsvision -d opsvision_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://opsvision:ci-only-ephemeral-password@127.0.0.1:5432/opsvision_test
      TEST_DATABASE_URL: postgresql://opsvision:ci-only-ephemeral-password@127.0.0.1:5432/opsvision_test
      BETTER_AUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
      APP_ENV: test
      ALLOW_SIMULATION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Ephemeral auth secret
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
