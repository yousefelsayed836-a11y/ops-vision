name: opsvision

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: opsvision
      POSTGRES_DB: opsvision
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD privately}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U opsvision -d opsvision"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the internal postgres service}
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile
      target: web
    ports:
      - "127.0.0.1:${OPSVISION_HOST_PORT:-3100}:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set a random secret of at least 32 characters}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set the external HTTPS origin}
      APP_URL: ${APP_URL:?Set the external HTTPS origin}
      APP_ENV: ${APP_ENV:-production}
      ALLOW_SIMULATION: ${ALLOW_SIMULATION:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile
      target: worker
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set the external HTTPS origin}
      APP_URL: ${APP_URL:?Set the external HTTPS origin}
      APP_ENV: ${APP_ENV:-production}
      ALLOW_SIMULATION: ${ALLOW_SIMULATION:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  postgres-data:
